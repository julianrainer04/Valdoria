<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08100f" />
  <title>Valdoria — Crown of the Seas</title>
  <link rel="stylesheet" href="valdoria.ui.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="brand" data-view="realm" aria-label="Zur Reichsübersicht">
        <span class="brand-mark">V</span>
        <span><b>VALDORIA</b><small>CROWN OF THE SEAS</small></span>
      </button>
      <nav id="main-nav" aria-label="Hauptnavigation"></nav>
      <div class="top-actions">
        <div class="season"><span id="date-label">Frühling 1487</span><small id="turn-label">Runde I</small></div>
        <button class="icon-button" id="save-button" title="Spielstände">⌑</button>
        <button class="end-turn" id="end-turn">RUNDE BEENDEN <span>›</span></button>
      </div>
    </header>

    <main>
      <section id="view"></section>
    </main>

    <footer class="command-dock">
      <div class="advisor-seal">VA</div>
      <div class="command-copy"><b>KÖNIGLICHER BEFEHL</b><span>Der Staatsrat übersetzt Euren freien Willen in konkrete Maßnahmen.</span></div>
      <form id="command-form">
        <input id="command-input" autocomplete="off" placeholder="z. B. „Senkt die Steuern in Frostholm und stärkt die Garnison.“" />
        <button type="submit">ERLASSEN</button>
      </form>
      <button class="help-button" id="help-button">?</button>
    </footer>
  </div>

  <div class="toast-stack" id="toasts" aria-live="polite"></div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <script src="valdoria.app.js"></script>
</body>
</html>
